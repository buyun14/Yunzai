openapi: 3.1.0

info:
  title: Yunzai WebUI API
  version: "1.0.0"
  description: |-
    TRSS-Yunzai 的运维面板接口。v1 是**只读**的：所有接口都是 `GET`。

    ## 启用
    在 `config/config/server.yaml` 里设置 `server.webui.enable: true`，且 `server.auth`
    必须非空——否则**不挂载** `/dashboard` 与 `/api/v1/*`（启动日志会给出可照抄的配置）。
    默认是关闭的，且旧配置里没有这个键，所以升级后不会自己打开。

    ## 鉴权
    与宿主既有路由共用 `serverAuth`：`server.auth` 是「请求头名 → 令牌」的映射，
    **请求头或查询参数任一键匹配**即通过，否则 401。头名由配置决定，
    下面的 `Authorization` 只是一个默认示例。

    ## 限流与体积
    `/api/v1/*` 统一挂一个 per-IP 令牌桶（默认突发 60 次、每秒回填 10 个）与 1MB 请求体上限。

    ## 错误形状
    统一为 `{ code, message }`。唯一的例外是 **401**：它由宿主的 `serverAuth` 产生，
    返回的是纯文本（`Unauthorized`），且会同时写入一条访问日志。

    ## 契约与实现的一致性
    `tests/unit/web/openapi.test.js` 会对照本文件与真实路由/真实响应做检查：
    路径与方法必须双边一致，`200` 响应的顶层字段必须与实际返回的字段一致。
    改接口时**必须同步改这里**，否则测试会红。

servers:
  - url: http://localhost:2536
    description: 默认端口，见 `server.yaml` 的 `server.port`

tags:
  - name: 状态
  - name: 配置
  - name: 日志

security:
  - serverAuth: []

paths:
  /api/v1/ready:
    get:
      tags: [状态]
      summary: 就绪探针
      description: |-
        前端等待页只依赖这一个接口。

        注意**启动期这个请求到不了这里**：`serverAuth` 是中间件链的第一个，
        `stat.online !== 2` 时它会把请求挂起等 `online` 事件，所以任何探针都到不了终点。
        WebUI 因此在 `serverAuth` 之前放了一个早期探针：启动期由它就地答复 `503`。
        换句话说，走到本接口就说明宿主已经上线。
      operationId: ready
      responses:
        "200":
          description: 宿主已上线
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ready"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Starting"

  /api/v1/status:
    get:
      tags: [状态]
      summary: 状态总览
      description: |-
        读的都是内核直接持有的数据，不自己算业务量（按消息/群/用户的统计在 `#状态` 命令那边）。
        与 `#状态` 命令**不共享实现**：那边产出的是给人看的文本，这里要的是稳定契约。
      operationId: status
      responses:
        "200":
          description: 状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/plugins:
    get:
      tags: [状态]
      summary: 已加载的插件
      description: |-
        数据来自内存里排好序的 `priority`，**不是**磁盘上的 `plugin.json`：
        面板要回答的是"现在生效的是哪些"，而插件被 `disable` 后 `plugin.json` 仍在磁盘上。

        数组顺序就是**执行顺序**（按 `priority` 升序），保持原样不做排序。

        `enabled` 反映的是 `group.yaml` 的 `default.disable` 名单。注意它是
        **按插件名**匹配的，且**更具体的群段可以盖过它**——所以 `enabled: true`
        只表示"没在全局停用名单里"，不代表它在每个群里都真的生效。
      operationId: plugins
      responses:
        "200":
          description: 插件列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plugins"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/plugins/{name}:
    put:
      tags: [状态]
      summary: 启用 / 停用一个插件
      description: |-
        写的是 `config/config/group.yaml` 的 `default.disable` 名单——
        内核判定插件是否生效看的就是它（`lib/plugins/loader.js` 的
        `groupCfg.disable.includes(plugin.name)`），而 `default` 段对所有群生效。

        ## 立刻生效，不需要重启
        每次消息进来都会重新算一遍生效范围；接口写完会显式打掉配置解析缓存
        （`lib/config/config.js` 的 `reload()`），所以下一次消息就按新名单走。

        ## 按**插件名**匹配，且群段可以盖过
        `disable` 匹配的是 `plugin` 构造函数里的 `name`（与 `GET` 返回的 `name` 同一个）。
        如果某个群单独配了 `enable: [这个插件]`，那条更具体的配置会盖过全局停用——
        接口拿不到"哪些群覆盖了它"，所以只在 `note` 里如实说明，不承诺"所有群都停了"。

        ## 写盘语义
        与配置写入接口同一套：同目录临时文件 + `rename`（原子），写前备份到
        `config/backups/`，注释原样保留。
      operationId: pluginToggle
      parameters:
        - name: name
          in: path
          required: true
          description: 插件名（`GET /api/v1/plugins` 里那个 `name`）
          schema:
            type: string
            examples: ["状态统计"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled:
                  type: boolean
                  description: true 启用（从停用名单移除）、false 停用（加入停用名单）
      responses:
        "200":
          description: 结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginToggleResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/config:
    get:
      tags: [配置]
      summary: 配置文件清单
      description: |-
        用户配置目录与出厂默认目录里 yaml 文件的**并集**，每个文件附上与默认的差异条数。

        只给条数不给值：值里可能有密钥，而清单会被反复轮询。要看值用
        `/api/v1/config/{name}`。
      operationId: configList
      responses:
        "200":
          description: 文件清单
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/config/schemas:
    get:
      tags: [配置]
      summary: 宿主配置的 schema
      description: |-
        把 `config/default_config/*.yaml` 的**结构描述**交给前端，供配置编辑表单（v2）渲染。

        ## 为什么是「列表」而不是 `/config/{name}/schema`
        ① `/config/:name` 已经占了那个位置，而 `schema` 恰好能匹配 `:name`
        （然后被文件名白名单拒掉）；② 前端一次就能决定整个页面怎么渲染，
        不必逐个文件试探。

        ## `schemas` 的形状
        受控 JSON Schema 子集（见 `docs/refactor/01-plugin-contract.md` §3.2）：
        `type` / `properties` / `items` / `required` / `default` / `enum` /
        `minimum` / `maximum` / `minLength` / `maxLength` / `pattern` /
        `title` / `description` / `x-widget`。**未列出的关键字不存在**——
        契约不逐个描述嵌套结构是刻意的：它的形态由那份子集定义，
        穷举一遍只会得到一份需要跟着子集同步的重复清单。

        `x-widget` 的取值：`password`（先遮住）、`textarea`、`select`、
        `raw`（**不要渲染成表单**，让用户直接编辑 yaml）。

        ## 与 `GET /api/v1/config` 的关系
        那个接口给的是**文件清单**（用户侧有没有、与默认差几项），
        这个给的是**结构描述**。前端把两者合起来才知道：
        哪些文件能出表单、哪些只能原始编辑、哪些用户侧还没有。
      operationId: configSchemas
      responses:
        "200":
          description: 已建模文件的 schema，以及明确不建模的文件与原因
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigSchemas"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/config/{name}:
    get:
      tags: [配置]
      summary: 单个配置文件
      description: |-
        返回该文件在用户侧与默认侧的**值**（已解析的 YAML，不是原文）。

        ## 脱敏
        看起来像密钥的键（`pass`/`password`/`secret`/`token`/`auth`/`credential`/`cookie`）
        会被**整值**替换成 `***`，并在 `redacted` 里列出路径。
        刻意不遮 `key`：`https.key` 是证书**路径**，遮了反而难排查。

        静默打码比不打码更糟——用的人会以为配置本身就是 `***`，所以必须回传被遮的路径。
      operationId: configFile
      parameters:
        - name: name
          in: path
          required: true
          description: |-
            配置文件名。白名单是 `^[\w.-]+\.ya?ml$`，且 `basename` 必须等于原名
            （所以 `../` 与绝对路径都过不去）。
          schema:
            type: string
            pattern: "^[\\w.-]+\\.ya?ml$"
            examples: [bot.yaml, server.yaml]
      responses:
        "200":
          description: 两侧的值
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigFile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

    put:
      tags: [配置]
      summary: 写入单个配置文件
      description: |-
        **整个 WebUI 里唯一会改宿主状态的接口。** 对应 `docs/refactor/06-webui.md`
        §3.5 的 v2 第二步。

        ## 四道闸门（任何一道不过都不写盘）
        1. 文件名过白名单（同 `GET`）；2. 该文件**已建模**（在
        `lib/config/host-schema.js` 里）；3. 请求体**不含敏感键**；4. 新值过该文件的
        schema 校验。顺序是刻意的：先拒签再校验，不给不允许写的文件做无用功。

        ## 敏感键为什么封死
        `server.yaml` 的 `auth` 与 `https` **不允许**通过面板修改：
        前者是面板自己的鉴权（能改它 = 能把令牌换成自己知道的值，
        或者把所有人锁在外面），后者是监听与证书配置（写错则重启起不来）。
        与 §3.3「启用 WebUI 必须配 auth」同一条思路：**面板不该有能力削弱自己的门卫**。
        要改就手动改 yaml。提交这两个键会得到 400。

        ## 未建模的文件
        `group.yaml`（顶层是动态键）与 `db.yaml`（已废弃）不通过 API 写，
        同样 400——面板表达不了它们的结构，硬写只会覆盖掉用户手写的段。

        ## 手滑保护
        请求体必须带 `confirmed: true`，否则 428。改写配置是不可逆的运维动作。

        ## 原子写与写前备份
        先写同目录临时文件再 `rename` 覆盖，所以目标文件**要么是旧内容、
        要么是新内容**，不会半截（半截的 yaml 会让下次启动解析失败）。
        原文件会先复制到 `config/backups/pre-write-<时间戳>-<文件名>`，
        目标已存在时加后缀、**绝不覆盖**。备份路径在响应里回传。

        ## 写入后不会立即生效
        配置是启动期一次性读进内存的，写盘**不影响正在运行的进程**，
        所以响应恒带 `restartRequired: true`。刻意不做热重载：绝大多数键
        （端口、监听地址、数据库路径）本来就热改不了，为每个键定义"能不能热改"
        的收益远小于成本。
      operationId: configWrite
      parameters:
        - name: name
          in: path
          required: true
          description: 同 `GET /api/v1/config/{name}` 的白名单
          schema:
            type: string
            pattern: "^[\\w.-]+\\.ya?ml$"
            examples: [bot.yaml, server.yaml]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfigWriteRequest"
      responses:
        "200":
          description: 已写入
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigWriteResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "428":
          description: |-
            缺少 `confirmed: true`。改写配置是不可逆的运维动作，
            刻意不复用 400：客户端据此能区分"参数写错了"与"还没确认"。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/control:
    get:
      tags: [控制]
      summary: 进程控制能力
      description: |-
        让界面知道"这个部署能不能做进程控制"——据此决定是显示按钮还是显示一句
        为什么不能点。让用户点完才被 403 拒掉是最差的体验。

        `canControl` 的依据是**请求来源地址**（本机与内网为 true）。
        重启与停止只允许这两类来源：它们能把服务停掉，而停止不会自己回来。
        ⚠️ 判断**不看 `X-Forwarded-For`**——那个头客户端可伪造，
        信它等于给公网一个关机按钮。远程运维请走 VPN / 隧道。
      operationId: controlCapabilities
      responses:
        "200":
          description: 能力
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ControlCapabilities"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/control/restart:
    post:
      tags: [控制]
      summary: 重启云崽
      description: |-
        **仅本机与内网来源**（否则 403）。返回 `202` 而不是 `200`：进程随后就会退出、
        连接会断，所以后端先把"已受理"发出去，延迟几百毫秒才真正重启。
        客户端拿到 202 应显示"正在重启…"，然后轮询 `/api/v1/ready` 等它回来。

        重启**会自己回来**：后端先关掉自己的 HTTP 监听把端口腾出来，再用
        `spawn(detached)` 拉起一个命令行完全相同的新进程。这个顺序不能反——
        内核的 `serverEADDRINUSE()` 在端口被占用时会向占用者发一个 `/exit`，
        新进程先起来的话会把老进程踢掉。
      operationId: controlRestart
      responses:
        "202":
          description: 已受理
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ControlAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/control/stop:
    post:
      tags: [控制]
      summary: 停止云崽
      description: |-
        **仅本机与内网来源**（否则 403）。⚠️ **停止不会自动恢复**：
        服务不会自己回来，而且面板本身也一起停了（它就跑在同一个进程里）。
        界面必须二次确认。

        走内核的 `Bot.exit()`，它会先妥善收尾 redis（`redisExit()`）——
        这正是"干净停止"与"直接 `process.exit`"的区别。
      operationId: controlStop
      responses:
        "202":
          description: 已受理
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ControlAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/plugins/{key}/reload:
    post:
      tags: [状态]
      summary: 不重启重载一个插件
      description: |-
        重载**一个插件文件**的代码，不需要重启宿主。

        复用内核已有的热更新路径（`lib/plugins/loader.js` 的 `changePlugin()`，
        文件监听热更新走的就是它），它已经处理好三件容易做错的事：

        1. 先 `unloadPlugin()` 摘掉 handlers 与定时任务；
        2. `import()` 时在路径后挂时间戳**破掉 ESM 模块缓存**——不带这个参数会拿到
           旧模块，表现为"重载了但行为没变"；
        3. **失败要回滚**：新代码加载失败时把旧的 handlers / 任务装回去，
           而不是留下一个半死不活的插件。

        ## 边界
        - `key` 必须是 `GET /api/v1/plugins` 里的 `key` 字段（插件目录内的相对路径）。
          服务端会做路径包含检查，`..` / 绝对路径 / 盘符一律 400——
          因为 key 会被拼进 `import()` 的路径。
        - 只重载一个文件。**插件之间有依赖时**，被依赖方的改动要重启才会反映到
          已经加载的引用方上。
        - 来源闸门比重启/停止松一档：**不限制来源**。能改配置的人本来就能改插件文件，
          重载只是省一次重启。
      operationId: pluginReload
      parameters:
        - name: key
          in: path
          required: true
          description: 插件文件的相对路径（`GET /api/v1/plugins` 的 `key`）
          schema:
            type: string
            examples: ["other/sendLog.js"]
      responses:
        "200":
          description: "重载成功（`reloaded: true`）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginReloadResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: 没有已加载的插件对应这个 key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          description: 重载后插件不在加载列表里（多半是新代码有错，请看日志）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginReloadResult"

  /api/v1/logs/recent:
    get:
      tags: [状态]
      summary: 最近日志快照
      description: |-
        **一次性 JSON 快照**，给首页摘要用。与 `/api/v1/logs` 的 SSE 长连接刻意分开：

        - SSE 一个页面开着就占一个订阅者；首页只想显示"最近发生了什么"、不需要逐条推送，
          为它开长连接是浪费，而且切走页面时的清理更容易出错。
        - 轮询的失败模式退化成"这块内容不更新"，不会留下半死不活的连接。

        返回顺序是**时间正序**（最新一条在数组末尾），由界面决定怎么显示。
        `limit` 会被夹在后端 backlog 以内。
      operationId: logsRecent
      parameters:
        - name: limit
          in: query
          required: false
          description: 取多少条。缺省或非法时取上限
          schema:
            type: integer
            minimum: 1
            default: 100
      responses:
        "200":
          description: 快照
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecentLogs"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/logs:
    get:
      tags: [日志]
      summary: 实时日志流（SSE）
      description: |-
        `text/event-stream`。连上后先**回放最近若干条**（默认 200，可用 `?limit=` 调整），
        之后实时推送；每 15 秒发一个注释行 `: ping` 保活。

        每个事件形如：

        ```
        event: log
        data: {"time":1758700000000,"level":"MARK","category":"command","message":"…"}
        ```

        - `level`：log4js 的等级（`TRACE`/`DEBUG`/`INFO`/`WARN`/`ERROR`/`FATAL`/`MARK`）
        - `category`：发日志的 logger 名（`message` 是默认 logger 的名字）
        - `message`：已去掉 ANSI 颜色码

        选 SSE 而不是 WebSocket 的理由见 `docs/refactor/06-webui.md` §3.5：单向、自动重连、
        不需要额外握手。日志来源是给 log4js 追加的 appender，与终端是**同一份**事件
        （落盘文件里没有 `info`/`debug`，那是选择 appender 而不是 tail 文件的原因）。

        ## 客户端注意
        响应头带 `Cache-Control: no-cache, no-transform`——宿主的 `compression()`
        会把小于阈值的分片攒在缓冲区里，而 SSE 全是小分片。
        中间有反向代理时，链路要关掉对 `text/event-stream` 的缓冲。
      operationId: logs
      parameters:
        - name: limit
          in: query
          required: false
          description: 回放条数。非法值或超过上限时退回上限。
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 200
      responses:
        "200":
          description: SSE 流（长连接；断开时服务端释放订阅）
          content:
            text/event-stream:
              schema:
                type: string
                description: 每帧是一个 log 事件（data 行里是 JSON），或一行保活注释
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

components:
  securitySchemes:
    serverAuth:
      type: apiKey
      in: header
      name: Authorization
      description: |-
        头名与令牌都来自 `server.auth` 配置（键名 = 请求头名）。这里的 `Authorization`
        只是默认示例；查询参数同名匹配也可以。
  responses:
    Unauthorized:
      description: |-
        鉴权失败。由宿主的 `serverAuth` 产生，响应体是**纯文本** `Unauthorized`，
        同时会写一条 `HTTP … 鉴权失败` 的访问日志。
      content:
        text/plain:
          schema:
            type: string
            examples: [Unauthorized]
    RateLimited:
      description: 超过 per-IP 令牌桶。`Retry-After` 是建议等待的秒数。
      headers:
        Retry-After:
          schema:
            type: integer
          description: 建议等待秒数
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PayloadTooLarge:
      description: 请求体超过上限（默认 1MB，或全局解析器的 100KB）。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    LengthRequired:
      description: multipart 请求缺少 `Content-Length`（没有长度就没有上界）。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: 请求不合法（文件名不合白名单、`Content-Length` 不是数字、JSON 解析失败等）。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: |-
        来源不允许做这个操作。目前只有 `/control/*` 会返回它：
        重启与停止**仅限本机与内网**，公网来源一律 403。

        刻意不用 401：401 会让人以为"令牌填错了"从而反复试令牌，
        而真正的原因是"你这个来源不允许做这件事"。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: 路径或资源不存在。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: 未预期的错误。响应体仍是 JSON——刻意不交给宿主的兜底处理，那里只 `res.end()`。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Starting:
      description: |-
        宿主尚未上线（`stat.online !== 2`）。由 WebUI 的早期探针产生，`Retry-After` 固定为 2 秒。
        `/dashboard` 上的同种情况会返回一个会自动刷新的一页提示。
      headers:
        Retry-After:
          schema:
            type: integer
          description: 建议等待秒数
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: |-
            稳定的机器可读码：`bad_request` / `not_found` / `rate_limited` /
            `payload_too_large` / `length_required` / `starting` / `internal_error`
          examples: [bad_request]
        message:
          type: string
          description: 给人看的说明（会随版本变化，不要用它做判断）
      additionalProperties: false

    Ready:
      type: object
      required: [ready, uptime]
      properties:
        ready:
          type: boolean
          const: true
        online:
          type: integer
          description: 宿主的 `stat.online`（`2` = 已上线）
        uptime:
          type: integer
          description: 进程运行秒数

    PluginReloadResult:
      type: object
      required: [key, reloaded, restartRequired, note]
      properties:
        key:
          type: string
        reloaded:
          type: boolean
          description: 重载后该插件是否仍在加载列表里（false 多半是新代码有错）
        restartRequired:
          type: boolean
          const: false
          description: 恒为 false——重载按定义就不需要重启
        note:
          type: string
          description: 如实说明边界（如"插件之间有依赖时，被依赖方的改动要重启"）

    RecentLogs:
      type: object
      required: [buffered, lines]
      properties:
        buffered:
          type: integer
          description: 服务端缓冲里现有多少条（受后端 backlog 限制，不代表历史总量）
        lines:
          type: array
          description: "**时间正序**，最新一条在末尾"
          items:
            $ref: "#/components/schemas/LogLine"

    LogLine:
      type: object
      required: [time, level, category, message]
      properties:
        time:
          type: integer
          description: 毫秒时间戳
        level:
          type: string
          description: log4js 等级：TRACE/DEBUG/INFO/WARN/ERROR/FATAL/MARK
        category:
          type: string
          description: 发日志的 logger 名（`message` 是默认 logger 的名字）
        message:
          type: string
          description: 已去掉 ANSI 颜色码；对象会被序列化

    Status:
      type: object
      required: [version, uptime, memory, runtime, plugins, adapters, accounts]
      properties:
        version:
          type: string
          description: 宿主版本（读 `package.json`）
        online:
          type: integer
        uptime:
          type: integer
        memory:
          $ref: "#/components/schemas/StatusMemory"
        runtime:
          $ref: "#/components/schemas/StatusRuntime"
        plugins:
          $ref: "#/components/schemas/StatusPlugins"
        adapters:
          type: array
          description: 已注册的适配器（`Bot.adapter`）
          items:
            type: object
            properties:
              id:
                type: [string, "null"]
              name:
                type: [string, "null"]
        accounts:
          type: array
          description: 宿主的 bot 账号。v1 只列 uin，不猜在线状态。
          items:
            type: object
            required: [uin]
            properties:
              uin:
                type: string

    StatusMemory:
      type: object
      required: [rss, heapUsed, heapTotal]
      properties:
        rss:
          type: number
          description: MB，两位小数
        heapUsed:
          type: number
        heapTotal:
          type: number

    StatusRuntime:
      type: object
      required: [node, platform, arch, pid]
      properties:
        node:
          type: string
          examples: [v24.19.0]
        platform:
          type: string
          examples: [linux, win32]
        arch:
          type: string
          examples: [x64, arm64]
        pid:
          type: integer

    StatusPlugins:
      type: object
      required: [handlers, loaded, tasks]
      properties:
        handlers:
          type: integer
          description: 加载器里的调度条目数（= `priority.length`）
        loaded:
          type: integer
          description: 插件**类**的数量
        tasks:
          type: integer
          description: 定时任务数

    Plugins:
      type: object
      required: [total, plugins]
      properties:
        total:
          type: integer
        plugins:
          type: array
          items:
            $ref: "#/components/schemas/Plugin"

    Plugin:
      type: object
      required: [name, namespace, key, priority, description, events, rules, enabled]
      properties:
        name:
          type: [string, "null"]
          description: 插件展示名。**启停就是按它匹配的**（`group.yaml` 的 `disable` 名单）
        namespace:
          type: [string, "null"]
        key:
          type: [string, "null"]
          description: 插件文件与类的标识，与日志里出现的那个一致
        priority:
          type: [integer, "null"]
          description: 声明值；为 null 表示没声明（实际顺序见数组下标）
        description:
          type: [string, "null"]
        events:
          type: array
          items:
            type: string
        rules:
          type: array
          items:
            $ref: "#/components/schemas/PluginRule"
        enabled:
          type: [boolean, "null"]
          description: |-
            是否在全局停用名单里。`null` 表示**这个条目没有名字**（`name` 为 null），
            也就无法用启停接口表达——界面应把它的开关禁用。

            注意 `true` 只表示"没被全局停用"，不代表它在每个群里都生效：
            更具体的群段（`enable`）可以盖过全局停用。

    PluginToggleResult:
      type: object
      required: [name, enabled, disableList, backup, restartRequired, note]
      properties:
        name:
          type: string
        enabled:
          type: boolean
          description: 写完之后的状态
        disableList:
          type: array
          description: 写完之后的全局停用名单（`group.yaml` 的 `default.disable`）
          items:
            type: string
        backup:
          type: [string, "null"]
          description: 写前备份的路径；原文件不存在或名单没变化时为 null
        restartRequired:
          type: boolean
          const: false
          description: 恒为 false——每次消息都会重算生效范围，写完立刻生效
        note:
          type: string
          description: 如实说明边界（如"更具体的群段可以盖过这条"）

    PluginRule:
      type: object
      required: [reg, fnc, permission, log]
      properties:
        reg:
          type: string
          description: 正则的 `source`（不带斜杠与标志）
        fnc:
          type: [string, "null"]
          description: 处理方法名
        permission:
          type: [string, "null"]
        log:
          type: [boolean, "null"]
          description: 值为 false 表示该规则的日志降级为 debug；null 表示没声明

    ConfigList:
      type: object
      required: [dirs, summary, files]
      properties:
        dirs:
          type: object
          required: [config, defaults]
          properties:
            config:
              type: string
            defaults:
              type: string
        summary:
          $ref: "#/components/schemas/ConfigDiffSummary"
        files:
          type: array
          items:
            type: object
            required: [name, status, differences]
            properties:
              name:
                type: string
              status:
                type: string
                enum: [both, only-user, only-default]
              differences:
                $ref: "#/components/schemas/ConfigDiffSummary"

    ConfigDiffSummary:
      type: object
      required: [files, missing, extra, changed]
      properties:
        files:
          type: integer
          description: 只有清单顶层才有；`differences` 里恒为 0
        missing:
          type: integer
          description: 默认有、用户没有的键数
        extra:
          type: integer
          description: 用户有、默认没有的键数
        changed:
          type: integer
          description: 两边都有但值不同的键数

    ConfigFile:
      type: object
      required: [name, status, user, defaults, redacted]
      properties:
        name:
          type: string
        status:
          type: string
          enum: [both, only-user, only-default]
        user:
          description: 用户侧解析后的 YAML；文件不存在时为 null
          oneOf:
            - type: object
            - type: array
            - type: string
            - type: number
            - type: boolean
            - type: "null"
        defaults:
          description: 出厂默认侧解析后的 YAML；文件不存在时为 null
          oneOf:
            - type: object
            - type: array
            - type: string
            - type: number
            - type: boolean
            - type: "null"
        redacted:
          type: array
          description: 被脱敏的路径（`a.b.c`；数组元素写成 `a[0].b`）
          items:
            type: string

    ConfigSchemas:
      type: object
      required: [schemas, unmodeled]
      properties:
        schemas:
          type: object
          description: |-
            `文件名 → 受控 JSON Schema 子集`。前端照它渲染表单。
            键就是 `config/default_config/` 下已建模的那些 yaml 文件名。

            这里刻意声明成开放对象（`additionalProperties: true`）而不展开每个文件的
            schema：嵌套结构的形态由 `docs/refactor/01-plugin-contract.md` §3.2
            的受控子集定义，在契约里再穷举一遍只会得到一份需要跟着子集同步的重复清单。
          additionalProperties: true
        unmodeled:
          type: array
          description: 明确**不建模**的文件与原因。前端据此让用户原始编辑，而不是当成"漏了"。
          items:
            type: object
            required: [name, reason]
            properties:
              name:
                type: string
                examples: [group.yaml]
              reason:
                type: string
                description: 为什么这个文件不用 schema 表达（如"顶层是动态键，受控子集表达不了"）

    ConfigWriteRequest:
      type: object
      required: [config, confirmed]
      properties:
        config:
          type: object
          description: |-
            要写进去的键值。**只提交想改的键**——处理器是"逐个 set"，不是整体替换，
            所以没提交的键在文件里原样保留（包括用户手写的注释）。

            会按该文件的 schema 校验；校验**不填默认值**：把没提交的键补成默认值
            等于替用户隐式改写他没碰过的字段。
          additionalProperties: true
        confirmed:
          type: boolean
          const: true
          description: 必须显式为 true，否则 428

    ConfigWriteResult:
      type: object
      required: [name, written, backup, restartRequired]
      properties:
        name:
          type: string
        written:
          type: boolean
          const: true
          description: "恒为 true——失败会走 4xx/5xx，不会返回 written: false"
        backup:
          type: [string, "null"]
          description: 写前备份的路径；原文件不存在时为 null（没有东西可备份）
        restartRequired:
          type: boolean
          const: true
          description: |-
            恒为 true：配置是启动期读进内存的，写盘不影响正在运行的进程。
            界面据此提示用户去重启。

    ControlCapabilities:
      type: object
      required: [canControl, stopIsRecoverable]
      properties:
        canControl:
          type: boolean
          description: |-
            当前**请求来源**是否被允许执行重启/停止。本机与内网为 true，公网为 false。
            界面据此决定显示按钮还是显示一句为什么不能点。
        stopIsRecoverable:
          type: boolean
          const: false
          description: 停止之后能不能自动恢复。恒为 false——界面据此加二次确认

    ControlAccepted:
      type: object
      required: [code, action, message]
      properties:
        code:
          type: string
          const: accepted
        action:
          type: string
          enum: [restart, stop]
        message:
          type: string
          description: 给用户看的说明（含"停止不会自动恢复"这类后果提示）
