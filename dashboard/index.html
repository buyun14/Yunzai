<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 面板里会显示日志与配置，不希望被搜索引擎收录 -->
    <meta name="robots" content="noindex, nofollow" />
    <!-- 内联的 data URI 图标：不留空就没有浏览器对 /favicon.ico 的自动请求，
         而那个请求会 401（面板的鉴权覆盖整个站点）、在控制台留一条假错误 -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='4' fill='%231976d2'/%3E%3Cpath d='M7 8h10M7 12h10M7 16h6' stroke='white' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <title>Yunzai 运维面板</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
