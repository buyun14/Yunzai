packages:
  - "plugins/**"
  # WebUI 前端工程（Vue 3 + Vite）。它自带 package.json 与依赖表，
  # 装法与联调见 dashboard/README.md；构建产物不进仓库。
  - "dashboard"

patchedDependencies:
  body-parser@2: lib/modules/body-parser.patch
  compression: lib/modules/compression.patch
  log4js: lib/modules/log4js.patch
  streamroller: lib/modules/streamroller.patch

strictDepBuilds: false
allowBuilds:
  classic-level: true
  log4js: true
  puppeteer: true
  sqlite3: true
  sharp: true
onlyBuiltDependencies:
  - classic-level
  - log4js
  - puppeteer
  - sqlite3
  - sharp
minimumReleaseAgeExclude:
  - prettier@3.9.9
