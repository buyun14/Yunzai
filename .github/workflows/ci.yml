name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # 在 CI 中跳过 git hooks 安装
  HUSKY: 0

jobs:
  checks:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          # 仓库不跟踪 pnpm-lock.yaml（plugins/** 是 workspace 成员，用户装插件会持续改动它），
          # 因此缓存键退化为 package.json。
          cache: pnpm
          cache-dependency-path: package.json

      - name: Install
        run: pnpm install --no-frozen-lockfile

      # 阻塞项：格式化校验同时承担语法检查（prettier 无法解析的文件会报错）
      - name: Format check
        run: pnpm lint

      # ESLint 基线已归零（阶段 3 第 8 步），因此改为阻塞项
      - name: ESLint
        run: pnpm lint:eslint

      # 首次引入，报错基线见 docs/refactor/03-engineering.md，清零后再改为阻塞
      - name: Typecheck
        run: pnpm typecheck
        continue-on-error: true

      - name: Test
        run: pnpm test

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    # 覆盖率与操作系统无关，因此只在单个组合上跑，避免矩阵里重复 4 遍
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: package.json

      - name: Install
        run: pnpm install --no-frozen-lockfile

      # 门槛在 vitest.config.js 的 coverage.thresholds；
      # 统计范围只含"改造涉及的核心模块"，理由见该文件注释
      - name: Coverage
        run: pnpm test:coverage
